name: Build A35 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm libssl-dev flex bison bc cpio kmod

      - name: Build kernel
        run: |
          make ARCH=arm64 LLVM=1 s5e8835-a35xjvxx_defconfig
          make ARCH=arm64 LLVM=1 -j$(nproc) Image

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-A35
          path: arch/arm64/boot/Image
          if-no-files-found: error
