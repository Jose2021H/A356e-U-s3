name: Build A35 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      PLATFORM_VERSION: "14"
      ANDROID_MAJOR_VERSION: "14"
      TARGET_SOC: s5e8835
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm libssl-dev flex bison bc cpio kmod libelf-dev dwarves

      - name: Build kernel
        run: |
          make LLVM=1 s5e8835-a35xjvxx_defconfig
          make LLVM=1 -j$(nproc) Image

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-A35
          path: arch/arm64/boot/Image
          if-no-files-found: error
